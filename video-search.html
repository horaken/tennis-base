
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テニス動画検索 | tennis-base.net</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-form { display:flex; gap:10px; flex-wrap:wrap; margin:24px 0; }
    .search-form input { flex:1; min-width:200px; padding:12px; font:inherit; border:1px solid #dce3e7; border-radius:6px; }
    .search-form button { padding:12px 20px; font:inherit; font-weight:bold; color:white; background:#2878a8; border:0; border-radius:6px; cursor:pointer; }
    #search-status { margin:16px 0; color:#637381; }
    .video-result { margin:16px 0; padding:20px; background:white; border:1px solid #dce3e7; border-radius:12px; overflow-wrap:anywhere; }
    .video-result h2 { font-size:1.2rem; margin:0 0 10px; }
    .video-result p { margin:6px 0; }
  </style>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="site-logo" href="index.html">tennis-base.net</a>
    <nav aria-label="メインメニュー">
      <ul class="nav-list">
        <li><a href="events.html">開催記録</a></li>
        <li><a href="schedule.html">今後の予定</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="section page-main">
  <div class="container">
    <p class="eyebrow">VIDEO SEARCH</p>
    <h1>テニス動画検索</h1>
    <p class="lead">登録したハンドルネームを入力して動画を検索できます。</p>

    <form id="search-form" class="search-form">
      <input id="handle-name" type="text"
        placeholder="ハンドルネームを入力" required>
      <button type="submit">検索</button>
    </form>

    <p id="search-status" aria-live="polite"></p>
    <div id="search-results"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">&copy; <span id="current-year"></span> tennis-base.net</div>
</footer>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwARW9dNjpqvTmRFXLJbFvb8rq0lVTVZCn_cyu-bLravLp6HdfNlKEqwldvJA14fcTu5g/exec";

const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, ch => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;",
  "'":"&#39;", '"':"&quot;"
})[ch]);

document.getElementById("current-year").textContent = new Date().getFullYear();

document.getElementById("search-form").addEventListener("submit", event => {
  event.preventDefault();

  const name = document.getElementById("handle-name").value.trim();
  const status = document.getElementById("search-status");
  const results = document.getElementById("search-results");

  if (!name) return;

  status.textContent = "検索しています…";
  results.replaceChildren();

  const callbackName = "videoSearchCallback";
  const oldScript = document.getElementById("video-search-api");
  if (oldScript) oldScript.remove();

  window[callbackName] = data => {
    delete window[callbackName];
    document.getElementById("video-search-api")?.remove();

    if (!data || !data.ok) {
      status.textContent = "検索に失敗しました。時間をおいて再度お試しください。";
      return;
    }

    const items = data.results || [];
    status.textContent = items.length
      ? `${items.length}件の動画が見つかりました。`
      : "該当する動画はありません。";

    results.innerHTML = items.map(item => {
      const videoUrl = String(item.videoUrl || "");
      const aiUrl = String(item.aiUrl || "");
      const safeVideoUrl = /^https?:\/\/[^\s"'<>]+$/i.test(videoUrl) ? videoUrl : "";
      const safeAiUrl = /^https?:\/\/[^\s"'<>]+$/i.test(aiUrl) ? aiUrl : "";
      const seconds = Number(item.startSeconds);
      const videoLink = safeVideoUrl
        ? `<p><a href="${escapeHtml(safeVideoUrl)}" target="_blank" rel="noopener noreferrer">動画を開く</a>${Number.isFinite(seconds) && seconds >= 0 ? `（開始位置：${seconds}秒）` : ""}</p>`
        : `<p>動画URLはまだ登録されていません。</p>`;
      const aiLink = safeAiUrl
        ? `<p><a href="${escapeHtml(safeAiUrl)}" target="_blank" rel="noopener noreferrer">AI診断を見る</a></p>`
        : "";

      return `<article class="video-result">
        <h2>${escapeHtml(item.eventName || "イベント")}</h2>
        <p>開催日：${escapeHtml(item.date)}</p>
        ${videoLink}${aiLink}
        ${item.memo ? `<p>メモ：${escapeHtml(item.memo)}</p>` : ""}
      </article>`;
    }).join("");
  };

  const script = document.createElement("script");
  script.id = "video-search-api";
  script.src = API_URL + "?name=" + encodeURIComponent(name)
    + "&callback=" + callbackName;
  script.onerror = () => {
    delete window[callbackName];
    status.textContent = "検索APIに接続できませんでした。GASの公開設定を確認してください。";
    script.remove();
  };
  document.body.appendChild(script);
});
</script>
</body>
</html>
