
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テニス動画コマ送りプレーヤー</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 900px;
    margin: 20px auto;
    padding: 0 12px;
  }
  video {
    width: 100%;
    background: #111;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }
  button, select {
    padding: 10px;
    cursor: pointer;
  }
  #status {
    margin: 10px 0;
    color: #444;
  }
</style>
</head>
<body>

<h2>テニス動画コマ送りプレーヤー</h2>

<video id="video" controls playsinline preload="metadata">
  お使いのブラウザは動画再生に対応していません。
</video>

<p>
  <a id="downloadLink" href="#" target="_blank" rel="noopener">
    動画を開く・ダウンロード
  </a>
</p>

<div class="controls">
  <button id="back">◀ 1コマ戻る</button>
  <button id="play">▶ 再生</button>
  <button id="pause">⏸ 停止</button>
  <button id="forward">1コマ進む ▶</button>
</div>

<div class="controls">
  <label>
    再生速度
    <select id="speed">
      <option value="0.25">0.25倍</option>
      <option value="0.5">0.5倍</option>
      <option value="0.75">0.75倍</option>
      <option value="1" selected>通常速度</option>
    </select>
  </label>

  <label>
    フレームレート
    <select id="fps">
      <option value="24">24 fps</option>
      <option value="25">25 fps</option>
      <option value="30" selected>30 fps</option>
      <option value="50">50 fps</option>
      <option value="60">60 fps</option>
      <option value="120">120 fps</option>
      <option value="240">240 fps</option>
    </select>
  </label>
</div>

<div id="status">動画を読み込んでいます。</div>

<script>
const video = document.getElementById("video");
const fpsSelect = document.getElementById("fps");
const speedSelect = document.getElementById("speed");
const status = document.getElementById("status");
const downloadLink = document.getElementById("downloadLink");

// URLパラメーターから動画を特定する
const params = new URLSearchParams(window.location.search);

// パラメーターがない場合は、現在使用している動画を表示する
const archiveId = params.get("id") || "0725_20261013";
const fileName = params.get("file") || "サーブ動画_0801.mp4";

// Internet Archiveの動画URLを作成
const videoUrl =
  "https://archive.org/download/" +
  encodeURIComponent(archiveId) + "/" +
  encodeURIComponent(fileName);

// 動画とダウンロードリンクを同じファイルに設定
video.src = videoUrl;
downloadLink.href = videoUrl;

function updateStatus() {
  if (!Number.isFinite(video.currentTime)) return;

  const frame = Math.round(
    video.currentTime * Number(fpsSelect.value)
  );

  status.textContent =
    `時間: ${video.currentTime.toFixed(3)} 秒 / ` +
    `推定フレーム番号: ${frame}`;
}

function stepFrame(direction) {
  if (!Number.isFinite(video.duration)) return;

  video.pause();

  const step = 1 / Number(fpsSelect.value);
  const target = Math.max(
    0,
    Math.min(
      video.duration,
      video.currentTime + direction * step
    )
  );

  video.currentTime = target;
  updateStatus();
}

document.getElementById("back").addEventListener(
  "click", () => stepFrame(-1)
);

document.getElementById("forward").addEventListener(
  "click", () => stepFrame(1)
);

document.getElementById("play").addEventListener(
  "click", () => video.play()
);

document.getElementById("pause").addEventListener(
  "click", () => video.pause()
);

speedSelect.addEventListener("change", () => {
  video.playbackRate = Number(speedSelect.value);
});

video.addEventListener("timeupdate", updateStatus);
video.addEventListener("seeked", updateStatus);
video.addEventListener("loadedmetadata", updateStatus);

video.addEventListener("error", () => {
  status.textContent =
    "動画を読み込めません。アイテムIDとファイル名を確認してください。";
});
</script>

</body>
</html>
