<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="tennis-base.net はテニスコミュニティの開催記録と予定をお届けするサイトです。" />
    <title>tennis-base.net | テニスコミュニティ</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-logo" href="index.html">tennis-base.net</a>
        <nav aria-label="メインメニュー">
          <ul class="nav-list">
            <li><a href="events.html">開催記録</a></li>
            <li><a href="schedule.html">今後の予定</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container">
          <p class="eyebrow">TENNIS COMMUNITY</p>
          <h1>テニスを、もっと気軽に。<br />もっと楽しく。</h1>
          <p class="lead">tennis-base.net は、テニスコミュニティの開催記録と今後の予定をお知らせするサイトです。</p>
          <a class="button" href="schedule.html">今後の開催予定を見る（開催予定表）</a>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="section-heading">
            <div>
              <p class="eyebrow">LATEST EVENT</p>
              <h2>最新開催情報（動画とＡＩ診断付き）</h2>
            </div>
            <a class="text-link" href="events.html">開催記録一覧を見る</a>
          </div>
          <div id="latest-event" class="event-card" aria-live="polite">開催情報を読み込んでいます…</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="current-year"></span> tennis-base.net</div>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
