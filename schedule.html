<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="tennis-base.net の今後の開催予定です。" />
    <title>今後の開催予定 | tennis-base.net</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-logo" href="index.html">tennis-base.net</a>
        <nav aria-label="メインメニュー">
          <ul class="nav-list">
            <li><a href="events.html">開催記録</a></li>
            <li><a aria-current="page" href="schedule.html">今後の予定</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="section page-main">
      <div class="container">
        <div class="page-heading-group">
          <p class="eyebrow">SCHEDULE</p>
          <h1>今後の開催予定</h1>
          <p class="lead">今後の開催予定を掲載しています。年月タブで切り替えて、日程・時間・開催場所をご確認いただけます。</p>
        </div>

        <!-- 年月タブフィルター -->
        <div id="schedule-filter-wrapper" class="events-filter-wrapper" aria-label="開催年月の選択"></div>

        <!-- 選択中ステータスバー -->
        <div id="schedule-summary-bar" class="events-summary-bar" aria-live="polite"></div>

        <!-- 開催予定カード一覧 -->
        <div id="schedule-list" class="card-list" aria-live="polite">開催予定を読み込んでいます…</div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="current-year"></span> tennis-base.net</div>
    </footer>
    <script src="js/app.js"></script>
  </body>
</html>
